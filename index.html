<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sivukohtaiset otsikko, kuvaus ja canonical hallitaan reiteittain
         Head-komponentilla (App.tsx / MakeraPage.tsx), jotta jokaisella
         reitilla on tasmalleen yksi oikea otsikko - ei kaksoiskappaleita. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%231A1815'/%3E%3Crect x='4.5' y='4.5' width='39' height='39' fill='none' stroke='%23B5821F' stroke-width='3'/%3E%3Ctext x='24' y='32' font-family='Arial, sans-serif' font-weight='700' font-size='19' letter-spacing='-1' fill='%23F4F1EA' text-anchor='middle'%3EPP%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontit ladataan renderöintiä estämättä (media=print -> all onloadissa);
         display=swap näyttää tekstin heti järjestelmäfontilla. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Vakio-OG (sama kaikilla sivuilla); otsikko/url/kuvaus reiteittain Headissa. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pohjapaja" />
    <meta property="og:image" content="https://pohjapaja.fi/media/ring-studio.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="Valmis puusormus vaalealla taustalla" />
    <meta property="og:locale" content="fi_FI" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://pohjapaja.fi/#business",
        "name": "Pohjapaja",
        "legalName": "Pohjakoodi (tmi)",
        "url": "https://pohjapaja.fi/",
        "email": "myynti@pohjapaja.fi",
        "slogan": "Pohjatyöstä viimeistelyyn.",
        "description": "CNC-verstas Helsingissä. Mittatilaustyönä koneistetut pienesineet: sormukset, kyltit, lasinaluset, avaimenperät, nahka- ja akryylityöt sekä piirilevyt ja prototyypit.",
        "image": "https://pohjapaja.fi/media/ring-studio.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Helsinki",
          "addressCountry": "FI"
        },
        "areaServed": { "@type": "Country", "name": "Finland" },
        "knowsLanguage": ["fi", "en"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Mitä koneistamme",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Sormukset",
                "description": "Puu & metalli, mittasi mukaan."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Kyltit",
                "description": "Nimi- ja logokyltit kaiverrettuna."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Lasinaluset",
                "description": "Koneistettua kovapuuta."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Avaimenperät",
                "description": "Henkilökohtainen kaiverrus."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Nahka & akryyli",
                "description": "Kaiverretut lahjat ja yksilöinnit."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Piirilevyt & prototyypit",
                "description": "Makereille ja yrityksille."
              }
            }
          ]
        },
        "additionalProperty": [
          {
            "@type": "PropertyValue",
            "name": "Materiaalit",
            "value": "Messinki, Alumiini, Kupari, Tammi, Akryyli, Nahka, PCB"
          },
          { "@type": "PropertyValue", "name": "Toistotarkkuus", "value": "0,02 mm" },
          { "@type": "PropertyValue", "name": "Työstöalue", "value": "200 × 200 × 100 mm" },
          { "@type": "PropertyValue", "name": "Karan nopeus", "value": "18000 rpm" },
          { "@type": "PropertyValue", "name": "Kone", "value": "Makera Z1 Pro" }
        ]
      }
    </script>
  </head>
  <body>
    <!-- vite-react-ssg täyttää tämän build-aikana koko sovelluksen valmiiksi
         maalatulla HTML:llä (hero + kaikki osiot). Client hydratoi päälle. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
